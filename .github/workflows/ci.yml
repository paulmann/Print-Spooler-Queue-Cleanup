name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native-tests:
    name: Unit tests (POSIX host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native logic tests (i18n tables, semver, json)
        run: bash tools/run_native_tests.sh

  mingw-cross:
    name: MinGW-w64 cross build + smoke
    runs-on: ubuntu-latest
    needs: native-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64-posix
      - name: Build
        run: bash tools/build_mingw.sh
      - name: Import check (system DLLs only)
        run: |
          x86_64-w64-mingw32-objdump -p dist/SpoolerCleanup.exe | grep "DLL Name" | sort > imports.txt
          cat imports.txt
          ! grep -viE "ADVAPI32|COMCTL32|GDI32|KERNEL32|SHELL32|SHLWAPI|USER32|UxTheme|WINHTTP|WINSPOOL|dwmapi|msvcrt|ole32|uuid" imports.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolerCleanup-mingw-x64
          path: dist/SpoolerCleanup.exe

  msvc:
    name: MSVC build (windows-latest)
    runs-on: windows-latest
    needs: native-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build with MSVC (x64, /MT, static)
        shell: cmd
        run: |
          rem The runner image does not promise a fixed edition/version path, so ask the
          rem VS installer which instance has the C++ toolset (vswhere ships with it).
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" goto :novs
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR goto :novs
          echo [info] Visual Studio: "%VSDIR%"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || goto :novs
          where cl || goto :novs
          tools\build_msvc.bat
          exit /b %ERRORLEVEL%
          :novs
          echo [FAIL] Visual Studio with the C++ toolset was not found (or vcvars64 failed)
          exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolerCleanup-msvc-x64
          path: dist/SpoolerCleanup.exe

  release:
    name: Publish release asset
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [mingw-cross, msvc]
    # records every published tag under Deployments, with the release page as URL
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64-posix
      - name: Build
        run: bash tools/build_mingw.sh
      - name: Rename asset
        run: |
          VER=${GITHUB_REF_NAME#v} if [ "$VER" = "main" ] || [ -z "$VER" ]; then VER=$(node -p "require('./npm/package.json').version"); fi
          cp dist/SpoolerCleanup.exe "dist/SpoolerCleanup-${VER}-x64.exe"
          echo "VER=$VER" >> $GITHUB_ENV
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpoolerCleanup-${{ env.VER }}-x64.exe
          generate_release_notes: true

  npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [release]
    # Publishing needs no stored secret: npm accepts the GitHub OIDC token of THIS workflow
    # (configure the trusted publisher on npmjs.com: paulmann / Print-Spooler-Queue-Cleanup / ci.yml).
    # A granular token in NPM_TOKEN is only a fallback and disappears in January 2027.
    permissions:
      id-token: write   # OIDC token for trusted publishing (no long-lived npm token)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # No registry-url on purpose: it would write .npmrc with an empty _authToken
          # (NODE_AUTH_TOKEN is not set), and npm could answer ENEEDAUTH before it ever
          # looks at the OIDC token. The default registry is registry.npmjs.org anyway.
          node-version: 24          # trusted publishing needs node >= 22.14 and npm >= 11.5.1
      - name: Show toolchain and OIDC availability
        run: |
          node --version
          npm --version
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "OIDC request URL: present"; else echo "OIDC request URL: MISSING"; fi
          npm config get registry
      - name: Check that the tag matches npm/package.json
        run: |
          VER=${GITHUB_REF_NAME#v} if [ "$VER" = "main" ] || [ -z "$VER" ]; then VER=$(node -p "require('./npm/package.json').version"); fi
          PKG=$(node -p "require('./npm/package.json').version")
          echo "tag=$VER package=$PKG"
          if [ "$VER" != "$PKG" ]; then
            echo "::error::tag v$VER does not match npm/package.json ($PKG) - bump the package first"
            exit 1
          fi
      - name: Fetch the released binary into the package
        working-directory: npm
        run: node prepare.js
      - name: Publish (trusted publishing via OIDC, provenance is automatic)
        working-directory: npm
        run: npm publish --access public --loglevel verbose

  npm-diag:
    name: npm toolchain probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Versions and OIDC
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "OIDC: present"; else echo "OIDC: MISSING"; fi
          npm config list